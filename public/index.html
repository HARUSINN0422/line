<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LINE Control</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101820;color:#edf3f7;font-family:system-ui,sans-serif}
main{max-width:620px;margin:40px auto;padding:20px}
h1{font-size:25px;font-weight:650}
.panel{background:#1c2934;border:1px solid #344653;border-radius:14px;padding:20px;margin:16px 0}
.status{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #344653}
.value{color:#a9d8b5}
button{width:100%;padding:15px;margin:7px 0;border:0;border-radius:9px;font-size:16px;font-weight:600;cursor:pointer}
.primary{background:#06c755;color:#071b10}
.secondary{background:#344653;color:#fff}
button:disabled,select:disabled{opacity:.4;cursor:not-allowed}
select{width:100%;padding:14px;margin:7px 0;background:#101820;color:#edf3f7;border:1px solid #506575;border-radius:9px;font-size:16px}
#message{min-height:48px;white-space:pre-wrap;color:#c8d5df}
small{color:#aab9c5;line-height:1.7}
</style>
</head>
<body>
<main>
<h1>LINE Control</h1>
<div class="panel">
  <div class="status"><span>ADB接続</span><span id="adb" class="value">確認中</span></div>
  <div class="status"><span>LINEアプリ</span><span id="line" class="value">確認中</span></div>
  <div class="status"><span>表示中のトーク</span><span id="room" class="value">---</span></div>
</div>
<div class="panel">
  <h3>LINE操作</h3>
  <button class="secondary" onclick="send('launch')">LINEを開く</button>
  <button class="secondary" onclick="loadGroups()">グループ一覧を取得</button>
  <select id="groups" disabled>
    <option value="">先にグループ一覧を取得してください</option>
  </select>
  <button class="secondary" id="openGroup" onclick="openSelectedGroup()" disabled>選択したグループを開く</button>
  <button class="primary" onclick="send('start')">選択したグループで音声通話を開始</button>
  <button class="secondary" disabled>通話に参加（準備中）</button>
  <button class="secondary" disabled>通話から退出（準備中）</button>
  <p id="message">状態を確認しています。</p>
</div>
<small>
このサイトは同じLAN内からの利用を想定しています。<br>
通話開始操作の前に、LINEで対象グループのトークを表示してください。
</small>
</main>
<script>
async function loadGroups(){
  const message=document.getElementById('message');
  const select=document.getElementById('groups');
  const openButton=document.getElementById('openGroup');
  message.textContent='グループ一覧を取得しています...';
  select.disabled=true;
  openButton.disabled=true;
  try{
    const r=await fetch('/api/groups',{cache:'no-store'});
    const d=await r.json();
    if(!r.ok) throw new Error(d.error||'一覧を取得できません');
    select.innerHTML='';
    if(!d.groups || d.groups.length===0){
      select.add(new Option('グループが見つかりません',''));
      message.textContent='グループが見つかりません。LINEのトーク一覧を表示して再取得してください。';
      return;
    }
    d.groups.forEach((g,i)=>{
      const label=g.name+(g.memberCount?' '+g.memberCount:'');
      select.add(new Option(label,String(i)));
    });
    select.disabled=false;
    openButton.disabled=false;
    message.textContent=d.groups.length+'件のグループを取得しました。対象を選択してください。';
  }catch(e){
    message.textContent='グループ一覧の取得に失敗: '+e.message;
  }
}
async function openSelectedGroup(){
  const select=document.getElementById('groups');
  if(select.value==='') return;
  await send('open-group',Number(select.value));
}
async function refresh(){
  try{
    const r=await fetch('/api/status');
    const s=await r.json();
    document.getElementById('adb').textContent=s.connected?'接続済み':'未接続';
    document.getElementById('line').textContent=s.running?'起動中':'停止中';
    document.getElementById('room').textContent=s.title||'取得できません';
  }catch(e){
    document.getElementById('adb').textContent='確認失敗';
  }
}
async function send(action,groupIndex){
  const m=document.getElementById('message');
  m.textContent='操作中...';
  try{
    const r=await fetch('/api/action',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action,groupIndex})
    });
    const d=await r.json();
    m.textContent=d.message||d.error||'完了';
  }catch(e){m.textContent='通信エラー: '+e.message}
  setTimeout(refresh,1000);
}
refresh();
setInterval(refresh,5000);
</script>
</body>
</html>
